name: Do things every 5 minutes
on:
  schedule:
    - cron: '*/5 * * * *'
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            FILE_NAME=$(date "+%Y-%m-%d_%H_%M")
            mongodump --db testdb --collection testCollection --out - | gzip > /backups/dump_github_action_$FILE_NAME.gz
            rclone copy /backups/dump_github_action_$FILE_NAME.gz r2:automated_backups